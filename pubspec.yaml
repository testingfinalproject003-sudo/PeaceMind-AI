name: peace_mind_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  audioplayers: ^6.7.1
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.0
  firebase_core: ^4.14.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^22.3.0
  flutter_native_splash: ^2.4.7
  flutter_tts: ^4.2.5
  http: ^1.6.0
  intl: ^0.20.3
  lottie: ^3.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.0.0
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/home/
    - assets/animations/
    - assets/audio/
    - assets/images/splash.png
    - assets/images/box_breathing_cover.png
    - assets/images/grounding_cover.png
    - assets/images/mindful_walking_cover.png
    - assets/images/body_scan_cover.png
    - assets/images/body_scan.jpg
    - assets/screenshots/
flutter_native_splash:
  color: "#2D1B69"
  image: assets/images/splash.png
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/splash.png"
  min_sdk_android: 21
  remove_alpha_ios: true
